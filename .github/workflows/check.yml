name: check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.test.mjs
      - run: node scripts/build-index.mjs --no-sign
      - run: for f in modules/*/index.js; do node --check "$f"; done
